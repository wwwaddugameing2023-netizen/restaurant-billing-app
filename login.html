
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Login</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #172554, #2563eb);
        }
        .login-box {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 10px 30px #0004;
        }
        h2 { text-align: center; color: #172554; }
        label { font-weight: bold; }
        input {
            width: 100%;
            padding: 13px;
            margin: 9px 0 18px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
        }
        button {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #1d4ed8; }
        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
        }
        .error {
            color: #dc2626;
            text-align: center;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>🔐 Owner Login</h2>
    <p style="text-align:center;color:#64748b;">Restaurant Management System</p>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <p class="error">{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <form method="POST" action="/login">
        <label>Username</label>
        <input type="text" name="username" placeholder="Enter username" required>

        <label>Password</label>
        <input type="password" name="password" placeholder="Enter password" required>

        <button type="submit">Login</button>
    </form>

    <a class="back" href="/">← Back to Worker Dashboard</a>
</div>

</body>
</html>
