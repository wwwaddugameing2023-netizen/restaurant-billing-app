
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Owner Password</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#172554;font-family:Arial}
.box{background:white;padding:30px;width:90%;max-width:420px;border-radius:12px}
h2{text-align:center;color:#172554}
label{font-weight:bold}
input{width:100%;padding:12px;margin:8px 0 17px;border:1px solid #cbd5e1;border-radius:6px;box-sizing:border-box}
button{width:100%;padding:13px;background:#2563eb;color:white;border:0;border-radius:6px;font-weight:bold;cursor:pointer}
a{display:block;text-align:center;margin-top:18px;color:#2563eb;text-decoration:none}
.error{color:#dc2626}
</style>
</head>
<body>
<div class="box">
<h2>🔐 Change Password</h2>

{% with messages = get_flashed_messages() %}
{% for message in messages %}
<p class="error">{{ message }}</p>
{% endfor %}
{% endwith %}

<form method="POST">
<label>Current Password</label>
<input type="password" name="current_password" required>

<label>New Password</label>
<input type="password" name="new_password" minlength="8" required>

<label>Confirm New Password</label>
<input type="password" name="confirm_password" minlength="8" required>

<button type="submit">Update Password</button>
</form>

<a href="/owner">← Back to Owner Dashboard</a>
</div>
</body>
</html>
